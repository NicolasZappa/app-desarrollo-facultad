<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">

        @if (loading()) {
          <div class="py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Verificando...</span>
            </div>
            <p class="mt-2 text-muted">Verificando email...</p>
          </div>
        } @else if (verified) {
          <i class="bi bi-check-circle display-4" style="color: #198754"></i>
          <h4 class="mt-3 fw-bold">Email verificado correctamente</h4>
          <p class="text-muted mt-2">Tu email ha sido verificado. Ya podés acceder a todas las funciones.</p>
          <a routerLink="/login" class="btn btn-primary w-100 mt-3">Ir a iniciar sesión</a>
        } @else {
          <i class="bi bi-x-circle display-4" style="color: #dc3545"></i>
          <h4 class="mt-3 fw-bold">Error de verificación</h4>
          <p class="text-muted mt-2">Token inválido o expirado</p>
          <a routerLink="/login" class="btn btn-primary w-100 mt-3">Iniciar sesión para reenviar</a>
        }

      </div>
    </div>
  </div>
</div>
