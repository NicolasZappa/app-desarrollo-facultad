<div class="toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast toast-{{ toast.type }}">
      <i class="bi {{ toast.type === 'success' ? 'bi-check-circle-fill' : toast.type === 'error' ? 'bi-exclamation-circle-fill' : 'bi-info-circle-fill' }}"></i>
      <span>{{ toast.message }}</span>
      <button class="toast-close" (click)="toastService.remove(toast.id)"><i class="bi bi-x"></i></button>
    </div>
  }
</div>
